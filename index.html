
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONPlaceholder Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>JSONPlaceholder Explorer</h1>
        <p>Explore users, posts, albums, photos and pending tasks</p>
    </header>

    <main class="layout">
        <aside class="users-panel">
            <h2>Users</h2>
            <div id="userlist">
                <p>Loading users...</p>
            </div>
        </aside>

        <section class="content-panel">
            <div class="profile">
                <div>
                    <h2 id="selectedusername">Select a user</h2>
                    <p id="selectedemail"></p>
                </div>
                <span id="selecteduserid"></span>
            </div>

            <nav class="tabs">
                <button class="tab active-tab" data-tab="posts">Posts</button>
                <button class="tab" data-tab="albums">Albums</button>
                <button class="tab" data-tab="todos">
                    Todos <span id="todocount" class="count">0</span>
                </button>
            </nav>

            <p id="message"></p>

            <section id="postsview" class="tab-content">
                <h2 class="section-title">Posts <span id="postcount"></span></h2>
                <div id="postslist"></div>
            </section>

            <section id="albumsview" class="tab-content hidden">
                <div id="albumslist"></div>
            </section>

            <section id="todosview" class="tab-content hidden">
                <h2 class="section-title">
                    Pending Todos <span id="pendingcount"></span>
                </h2>
                <p class="muted">Check a task when it is completed.</p>
                <div id="todoslist"></div>
            </section>
        </section>
    </main>
</body>
</html>
